<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المحافظ الاستثمارية - PortoFlow Pro</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glass: {
                            bg: 'rgba(15, 23, 42, 0.75)',
                            card: 'rgba(30, 41, 59, 0.65)',
                            border: 'rgba(255, 255, 255, 0.08)',
                            hover: 'rgba(255, 255, 255, 0.05)',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap');
        * { font-family: 'Tajawal', sans-serif; user-select: none; }
        body { background: radial-gradient(circle at top right, #0f172a 0%, #020617 100%); color: #f8fafc; min-height: 100vh; }
        .glass-panel { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1rem; }
        .glass-panel-sm { background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .ticker-wrap { width: 100%; overflow: hidden; white-space: nowrap; }
        .ticker-move { display: inline-block; white-space: nowrap; animation: marquee 35s linear infinite; }
        .ticker-move:hover { animation-play-state: paused; }
        @keyframes marquee { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
        @media print { .no-print { display: none !important; } body { background: white; color: black; } }
    </style>
</head>
<body class="p-3 md:p-6 text-slate-200">

    <!-- 1. LOGIN SECTION -->
    <div id="login-container" class="flex items-center justify-center min-h-[90vh]">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <div class="inline-flex p-3.5 bg-indigo-500/10 border border-indigo-500/20 rounded-2xl text-indigo-400 mb-3 shadow-lg">
                    <i data-lucide="shield-check" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-wide text-white">نظام إدارة المحافظ الاستثمارية</h1>
                <p class="text-xs text-indigo-400 font-semibold mt-1.5">تسجيل الدخول للنظام (اسم المستخدم وكلمة المرور)</p>
            </div>

            <div class="glass-panel p-8">
                <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
                    <h2 class="text-base font-bold text-white flex items-center gap-2">
                        <i data-lucide="lock" class="w-4 h-4 text-indigo-400"></i>
                        تسجيل الدخول
                    </h2>
                </div>

                <div class="space-y-4 text-xs">
                    <div>
                        <label class="block text-slate-300 mb-1.5 font-medium">اسم المستخدم</label>
                        <div class="relative">
                            <i data-lucide="user" class="w-4 h-4 absolute right-3.5 top-3 text-slate-500"></i>
                            <input type="text" id="login-username" value="admin" placeholder="admin" 
                                class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl pr-10 pl-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-all">
                        </div>
                    </div>

                    <div>
                        <label class="block text-slate-300 mb-1.5 font-medium">كلمة المرور</label>
                        <div class="relative">
                            <i data-lucide="key" class="w-4 h-4 absolute right-3.5 top-3 text-slate-500"></i>
                            <input type="password" id="login-password" value="admin123" placeholder="••••••••" 
                                class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl pr-10 pl-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-all">
                        </div>
                    </div>

                    <div class="flex items-center justify-between py-1">
                        <label class="flex items-center gap-2 text-slate-400 cursor-pointer">
                            <input type="checkbox" id="remember-me" checked class="rounded border-slate-700 bg-slate-900 text-indigo-600 focus:ring-0">
                            <span>حفظ اسم المستخدم وكلمة المرور</span>
                        </label>
                    </div>

                    <button type="button" onclick="processLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30 text-sm">
                        <i data-lucide="log-in" class="w-4 h-4"></i>
                        <span>دخول النظام</span>
                    </button>
